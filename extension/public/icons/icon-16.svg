<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect width="16" height="16" fill="#ffffff"/>

  <!-- two lines top, two lines bottom — flanking the play triangle.
       five lines is unreadable at 16px. -->
  <g stroke="#000000" stroke-width="1.2" stroke-linecap="round">
    <line x1="2" y1="2.5" x2="14" y2="2.5"/>
    <line x1="2" y1="13.5" x2="14" y2="13.5"/>
  </g>

  <polygon points="5,4.5 5,11.5 12,8" fill="#000000"/>
</svg>
