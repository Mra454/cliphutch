name = "cliphutch-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat_v2"]

# D1 database. The database_id is set by `wrangler d1 create cliphutch-licenses`.
# Replace REPLACE_AFTER_WRANGLER_D1_CREATE with the UUID it prints.
[[d1_databases]]
binding = "DB"
database_name = "cliphutch-licenses"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

# Public env vars (non-secret). Secrets are set via `wrangler secret put`:
#   STRIPE_WEBHOOK_SECRET
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
[vars]
MAX_DEVICES_PER_LICENSE = "5"
